name: Deploy API to Cloud Run

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Injetar Chaves de Segurança (JWT)
        run: |
          echo "${{secrets.JWT_PRIVATE_KEY }}" > src/main/resources/app.key
          echo "${{secrets.JWT_PUBLIC_KEY }}" > src/main/resources/app.pub

      - name: Autenticação no Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Configurar o Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy no Cloud Run
        run: |
          gcloud run deploy api-fibras-naturais \
            --source . \
            --region us-east1 \
            --project ${{ secrets.GCP_PROJECT_ID }} \
            --platform managed \
            --quiet
spring.application.name=authenticationJwt

spring.sql.init.data-locations=classpath:data-prod.sql
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

spring.jpa.hibernate.ddl-auto=update

spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.show-sql=true

spring.cloud.gcp.project-id=${GCP_PROJECT_ID}

gcp.bucket.name=${GCP_BUCKET_NAME}

spring.cloud.gcp.credentials.location=file:${GCP_CREDENTIALS_PATH}